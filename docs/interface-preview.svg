<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title description">
  <title id="title">Visão geral da Gestão de Inventário Patrimonial</title>
  <desc id="description">Prévia ilustrativa da tela principal com os módulos recolhidos: situação da base, importação, preparação, leilão, conferência, busca, relatórios e backups.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#143f83"/>
      <stop offset="1" stop-color="#155eef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#14213d" flood-opacity=".07"/>
    </filter>
    <style>
      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .muted { fill: #64748b; }
      .eyebrow { fill: #61728b; font-size: 13px; font-weight: 800; letter-spacing: 1.2px; }
      .card { fill: #fff; stroke: #dbe3ee; stroke-width: 1.5; }
      .title { fill: #152238; font-size: 20px; font-weight: 700; }
      .body { fill: #64748b; font-size: 15px; }
      .button { fill: #155eef; }
      .button-text { fill: #fff; font-size: 14px; font-weight: 700; }
      .field { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1440" height="1180" fill="#f3f6fa"/>
  <path d="M0 0h1440v150H0z" fill="url(#header)"/>
  <text class="sans" x="48" y="47" fill="#bfdbfe" font-size="14" font-weight="800" letter-spacing="2">VISÃO GERAL DO SISTEMA</text>
  <text class="sans" x="48" y="91" fill="#fff" font-size="34" font-weight="700">Gestão de Inventário Patrimonial</text>
  <text class="sans" x="48" y="124" fill="#dbeafe" font-size="17">Módulos recolhidos para visualizar as principais funcionalidades.</text>
  <text class="sans" x="1260" y="72" fill="#fff" fill-opacity=".72" font-size="24" font-weight="800" letter-spacing="1">F3</text>
  <text class="sans" x="1260" y="94" fill="#dbeafe" fill-opacity=".7" font-size="10" font-weight="700" letter-spacing="2">TECNOLOGIA</text>

  <g filter="url(#shadow)">
    <rect class="card" x="40" y="172" width="1360" height="94" rx="14"/>
    <rect class="card" x="40" y="284" width="664" height="142" rx="14"/>
    <rect class="card" x="736" y="284" width="664" height="142" rx="14"/>
    <rect class="card" x="40" y="444" width="1360" height="148" rx="14"/>
    <rect class="card" x="40" y="610" width="1360" height="122" rx="14"/>
    <rect class="card" x="40" y="750" width="1360" height="144" rx="14"/>
    <rect class="card" x="40" y="912" width="664" height="126" rx="14"/>
    <rect class="card" x="736" y="912" width="664" height="126" rx="14"/>
  </g>

  <text class="sans eyebrow" x="68" y="208">BASE OPERACIONAL</text>
  <text class="sans title" x="68" y="240">Situação da base</text>
  <text class="sans body" x="420" y="235">Resumo, fontes importadas, preparação e disponibilidade das fotos.</text>
  <text class="sans muted" x="1360" y="235" text-anchor="end" font-size="24">⌄</text>

  <text class="sans eyebrow" x="68" y="319">ENTRADA DE DADOS</text>
  <text class="sans title" x="68" y="351">Importar cadastro patrimonial</text>
  <text class="sans body" x="68" y="380">Validação e importação do cadastro CSV.</text>
  <rect class="button" x="68" y="393" width="210" height="25" rx="7"/>
  <text class="sans button-text" x="173" y="411" text-anchor="middle">Validar e importar CSV</text>

  <text class="sans eyebrow" x="764" y="319">FONTES AUXILIARES</text>
  <text class="sans title" x="764" y="351">Preparação SH3</text>
  <text class="sans body" x="764" y="380">Importação de bens alienados e baixados; preparar dados.</text>
  <rect class="button" x="764" y="393" width="188" height="25" rx="7"/>
  <text class="sans button-text" x="858" y="411" text-anchor="middle">Preparar Dados (SH3)</text>

  <text class="sans eyebrow" x="68" y="479">CONTROLE SEPARADO DO PATRIMÔNIO</text>
  <text class="sans title" x="68" y="511">Itens previstos para leilão</text>
  <text class="sans body" x="68" y="540">Importar Excel/CSV, cadastrar itens, criar lotes e acompanhar valores.</text>
  <text class="sans body" x="68" y="565">Organizar e vincular itens, filtrar a lista e exportar Excel.</text>
  <rect class="field" x="1015" y="509" width="330" height="38" rx="8"/>
  <text class="sans muted" x="1030" y="534" font-size="14">Nome e valor do lote</text>
  <rect class="button" x="1356" y="509" width="20" height="38" rx="7"/>
  <text class="sans" x="1366" y="534" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">+</text>

  <text class="sans eyebrow" x="68" y="645">CONFERÊNCIA</text>
  <text class="sans title" x="68" y="677">Conferência por setor</text>
  <text class="sans body" x="450" y="673">Revisar bens, registrar status, estado e observações; incluir bem sem plaqueta.</text>
  <rect class="field" x="1070" y="651" width="250" height="38" rx="8"/>
  <text class="sans muted" x="1085" y="676" font-size="14">Selecionar setor</text>
  <rect class="button" x="1332" y="651" width="44" height="38" rx="7"/>
  <text class="sans button-text" x="1354" y="676" text-anchor="middle">Ir</text>

  <text class="sans eyebrow" x="68" y="785">CONSULTA E RELATÓRIOS</text>
  <text class="sans title" x="68" y="817">Busca geral de bens</text>
  <text class="sans body" x="68" y="847">Pesquisar e filtrar por setor, status, plaqueta, foto e datas; gerar Excel ou PDF.</text>
  <rect class="field" x="960" y="790" width="416" height="40" rx="8"/>
  <text class="sans muted" x="976" y="816" font-size="14">Código, plaqueta, descrição ou observação</text>
  <rect class="button" x="1292" y="840" width="84" height="32" rx="7"/>
  <text class="sans button-text" x="1334" y="861" text-anchor="middle">Buscar</text>

  <text class="sans eyebrow" x="68" y="946">RELATÓRIOS</text>
  <text class="sans title" x="68" y="978">Relatório de pendências</text>
  <text class="sans body" x="68" y="1008">Resumo gerencial por setor e classificação.</text>
  <text class="sans muted" x="668" y="980" text-anchor="end" font-size="24">⌄</text>

  <text class="sans eyebrow" x="764" y="946">PROTEÇÃO DOS DADOS</text>
  <text class="sans title" x="764" y="978">Backup e restauração</text>
  <text class="sans body" x="764" y="1008">Criar backups e restaurar dados da aplicação.</text>
  <text class="sans muted" x="1364" y="980" text-anchor="end" font-size="24">⌄</text>

  <text class="sans muted" x="720" y="1094" text-anchor="middle" font-size="14">Prévia ilustrativa • Os dados reais da instalação não são exibidos.</text>
</svg>
