<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Gestão de Inventário Patrimonial</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=30">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Acesso protegido</p>
      <h1>Gestão de Inventário Patrimonial</h1>
      <p class="subtitle">Entre com sua conta para continuar.</p>
    </div>
  </header>
  <main class="auth-main">
    <section class="card auth-card">
      <h2>Entrar</h2>
      {% if erro %}
      <p class="error-text" role="alert">{{ erro }}</p>
      {% endif %}
      <form method="post" action="{{ url_for('autenticacao.login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="nome-usuario">Usuário</label>
        <input id="nome-usuario" name="nome_usuario" autocomplete="username" required autofocus>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>
        <button class="button button-primary full-width" type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
